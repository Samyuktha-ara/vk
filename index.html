<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071a3d" />

    <!-- Baseline metadata. Per-page <title>/<meta>/<link rel=canonical> are
         rendered by <Seo /> and hoisted into <head> by React 19. -->
    <title>
      Real Estate &amp; Property Developers in Thanjavur | VK Real Estate &amp;
      Promoters
    </title>
    <meta
      name="description"
      content="Explore premium properties, residential projects and investment opportunities in Thanjavur with VK Real Estate &amp; Promoters. Building trust, creating futures."
    />

    <link rel="icon" type="image/png" href="/vk-mark.png" />
    <link rel="apple-touch-icon" href="/vk-mark.png" />

    <!-- Typography: preconnect early, load once, swap without blocking paint -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500;600;700&display=swap"
      />
    </noscript>

    <!-- PLACEHOLDER IMAGERY: remove this preconnect once photography is
         self-hosted from /src/assets. See src/data/media.js. -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link
      rel="preload"
      as="image"
      fetchpriority="high"
      href="https://images.unsplash.com/photo-1600585153490-76fb20a32601?auto=format&fit=crop&q=72&w=1600"
      imagesrcset="
        https://images.unsplash.com/photo-1600585153490-76fb20a32601?auto=format&fit=crop&q=72&w=960 960w,
        https://images.unsplash.com/photo-1600585153490-76fb20a32601?auto=format&fit=crop&q=72&w=1280 1280w,
        https://images.unsplash.com/photo-1600585153490-76fb20a32601?auto=format&fit=crop&q=72&w=1800 1800w"
      imagesizes="(max-width: 1024px) 100vw, 58vw"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 3rem 1.5rem; font-family: system-ui, sans-serif">
        <h1>
          VK Real Estate &amp; Promoters — property development in Thanjavur
        </h1>
        <p>
          This site needs JavaScript to run. Please call
          <a href="tel:+919000000000">+91 90000 00000</a> or email
          <a href="mailto:enquiries@vkestates.in">enquiries@vkestates.in</a> and
          we will send you project details directly.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
