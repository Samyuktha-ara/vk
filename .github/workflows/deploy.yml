# Build the site and deploy it to S3 + CloudFront on every push to main.
#
# AWS access uses GitHub OIDC — no long-lived keys are stored in GitHub.
# One-time setup (AWS account 410232017016): an IAM OIDC identity provider for
# token.actions.githubusercontent.com and a role that trusts this repo; its
# ARN goes in the repository variable AWS_DEPLOY_ROLE_ARN.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # request the OIDC token for AWS
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  S3_BUCKET: vkrealestateandpromoters-site
  CLOUDFRONT_DISTRIBUTION_ID: E1NITIG8LV79RQ

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Hashed bundles never change under the same name — cache for a year.
      # No --delete: pages still being served from the old deploy keep
      # working until the new HTML lands. Old bundles are a few hundred kB.
      - name: Upload hashed assets
        run: >
          aws s3 sync dist/assets "s3://$S3_BUCKET/assets"
          --cache-control "public,max-age=31536000,immutable"

      # Photos keep stable names, so give them a shorter browser cache.
      - name: Upload photos
        run: >
          aws s3 sync dist/photos "s3://$S3_BUCKET/photos"
          --delete --cache-control "public,max-age=604800"

      # HTML, icons, robots and sitemap: always revalidate.
      - name: Upload pages and root files
        run: >
          aws s3 sync dist "s3://$S3_BUCKET"
          --delete --exclude "assets/*" --exclude "photos/*"
          --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: >
          aws cloudfront create-invalidation
          --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"
